<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="indexstyle.css">
    <title>Portfolio och CV</title>
</head>
<body>
    <header id="header">
        <img src="#" alt="Min logga">
        <h1>Rubrik</h1>
    </header> <br>
    <main> 
        <!--Gör en sektion för kontroll över layouten
            Med nästlade sektioner för att enkelt kunna ändra 
            alla de olika delarna av min sida.
            Använder mig av id-selektorer för att kunna komma åt 
            specifika element/items-->

        <section id="layout">

            <header id="vemJag"> 
                <h2>Vem är jag?</h2> 
            </header>

            <section id="minBild">
                <img src="#" alt="Bild på mig">
            </section>

            <section id="omMig">
                <p>Text om mig</p>
            </section>

            <section id="annat">
                <p>Annat</p>
            </section>

            <section id="arbete">
                <p>Arbetserfarenheter</p>
            </section>

            <!--Nav istället för section för länkarna-->
            <nav id="övningar">
                <P>Länkar till övningar</P>
                <P>Fler länkar till övningar</P>
            </nav>

        </section>
    </main>
   

</body>
</html>
